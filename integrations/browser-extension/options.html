<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chart Cleaner extension</title>
  <style>
    body { font: 14px system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; }
    label { display: block; margin-top: 16px; font-weight: 600; }
    input { width: 100%; padding: 6px; font: 13px ui-monospace, monospace; box-sizing: border-box; }
    button { margin-top: 16px; padding: 6px 14px; }
    p { color: #555; }
  </style>
</head>
<body>
  <h1>Chart Cleaner</h1>
  <p>Select chart text on any page, right-click, and choose Clean, Abbreviate or Expand. The text
     goes only to the Chart Cleaner app on this computer; the result is copied to your clipboard.</p>
  <label for="port">App port (shown in the address bar of the Chart Cleaner app)</label>
  <input id="port" inputmode="numeric" placeholder="8765">
  <label for="token">Token (Chart Cleaner → Settings → Local API → Copy)</label>
  <input id="token" type="password" autocomplete="off">
  <button id="save">Save</button> <span id="status"></span>
  <script src="options.js" type="module"></script>
</body>
</html>
