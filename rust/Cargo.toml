[workspace]
resolver = "2"
members = [
    "crates/chartcleaner-core",
    "crates/chartcleaner-app",
]

[workspace.package]
version = "2.5.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["ChartCleaner Team"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
csv = "1.3"
regex = "1.11"
fancy-regex = "0.14"
sha1 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1.42", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["limit", "trace", "cors"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
subtle = "2.6"
arboard = "3.4"
sha2 = "0.10"
walkdir = "2.5"
unicode-normalization = "0.1"
ahash = "0.8"
once_cell = "1.21"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
