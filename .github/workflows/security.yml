name: Dependency audit

# Weekly, plus on demand. Not part of the PR gate: a new CVE published upstream
# must not block unrelated work, but it must not go unnoticed either.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-audit
  cancel-in-progress: true

jobs:
  pip-audit:
    name: pip-audit (installed environment)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the runtime environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Audit installed distributions
        run: |
          python -m pip install pip-audit
          # Audit the environment rather than requirements.txt: the spaCy model
          # is installed from a release wheel URL, which pip-audit cannot
          # resolve as a PyPI requirement.
          pip-audit --desc on --progress-spinner off
