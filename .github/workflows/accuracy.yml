name: Cleaning accuracy
# Scheduled/manual only: the held-out split and large performance runs are
# checkpoint measurements, not per-PR assertions (the deterministic accuracy
# tests run in tests.yml with the rest of pytest).
on:
  schedule:
    - cron: "23 4 * * 1" # Mondays, after the weekend's work
  workflow_dispatch:
    inputs:
      sizes:
        description: "Benchmark sizes (chars)"
        default: "100000 1000000 5000000"
permissions:
  contents: read
concurrency:
  group: accuracy
  cancel-in-progress: true
jobs:
  evaluate:
    name: accuracy (${{ matrix.split }}, ${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        split: [development, held-out]
        mode: [off, shadow, enforce]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Evaluate
        run: >
          python scripts/evaluate_cleaning_accuracy.py
          --split ${{ matrix.split }} --mode ${{ matrix.mode }}
          --report artifacts/${{ matrix.split }}-${{ matrix.mode }}.json
      - name: Release gate (recorded; labels are provisional)
        if: matrix.mode == 'enforce'
        run: >
          python scripts/check_accuracy_release.py
          --report artifacts/${{ matrix.split }}-enforce.json
          --baseline tests/accuracy/baseline-${{ matrix.split }}.json
          --out artifacts/gate-${{ matrix.split }}.json
        continue-on-error: true
      - name: No new critical escapes (hard gate)
        if: matrix.mode == 'enforce'
        run: >
          python scripts/check_accuracy_release.py
          --report artifacts/${{ matrix.split }}-enforce.json
          --baseline tests/accuracy/baseline-${{ matrix.split }}.json
          --require no_new_critical_escapes --out artifacts/gate-hard-${{ matrix.split }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accuracy-${{ matrix.split }}-${{ matrix.mode }}
          path: artifacts/

  performance:
    name: validation benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Benchmark (cold/warm, all modes, synthetic charts)
        run: >
          python scripts/benchmark_validation.py
          --sizes ${{ inputs.sizes || '100000 1000000 5000000' }}
          --report artifacts/benchmark.json
      - name: Install browser for Clean stability benchmark
        run: python -m playwright install --with-deps chromium
      - name: Start Chart Cleaner
        run: python app.py --port 8765 --no-browser &
      - name: Wait for Chart Cleaner readiness
        run: |
          python - <<'PY'
          import time
          import urllib.request

          deadline = time.monotonic() + 60
          while True:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8765/api/v1/ready", timeout=2) as response:
                      if response.status == 200:
                          break
              except Exception:
                  pass
              if time.monotonic() >= deadline:
                  raise SystemExit("Chart Cleaner did not become ready within 60 seconds")
              time.sleep(0.5)
          PY
      - name: Clean-page stability benchmark
        run: >
          python scripts/benchmark_clean_stability.py
          --cycles 10 --chars 100000 250000 500000
          --report artifacts/clean-stability.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accuracy-benchmark
          path: artifacts/
